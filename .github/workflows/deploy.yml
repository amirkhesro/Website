# Builds the Eleventy site and publishes it to GitHub Pages.
#
# Deployment is the artifact method rather than a gh-pages branch: the job
# below uploads _site as an artifact and GitHub serves it directly. Nothing
# built is ever committed, so _site stays in .gitignore.
name: Deploy to GitHub Pages

on:
  # Every push to main republishes the site.
  push:
    branches: [main]

  # And the workflow can be run by hand from the Actions tab.
  workflow_dispatch:

# Only what the deployment needs: read the repository, write a Pages
# deployment, and mint the OIDC token that deploy-pages authenticates with.
permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes in quick succession must not race each other onto the live
# site. Queued runs are superseded; a run already deploying is left to
# finish rather than being cancelled part way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24, matching the version the site is built with locally.
          node-version: '24'
          cache: npm

      # npm ci, not npm install: it installs exactly what package-lock.json
      # pins, so the build here uses the same Eleventy as the build at home.
      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload _site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
